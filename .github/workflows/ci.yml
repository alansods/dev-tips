# Verifica o app e a API em todo PR e em todo push na main e na dev.
# Os testes locais continuam valendo; esta é a segunda verificação, numa
# máquina limpa. Os nomes dos jobs (app e api) são os checks exigidos
# pelos rulesets da main e da dev.

name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Em PR, um commit novo cancela a execução antiga; em main e dev, todas terminam.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx prettier --check .
      - run: npm test
      - run: npx -y @fission-ai/openspec@1.7.0 validate --strict --all

  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
